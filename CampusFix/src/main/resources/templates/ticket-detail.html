<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticket details | CampusFix</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><div class="shell"><header class="bar"><a class="logo" href="/">Campus<span>Fix</span></a><span class="tag">Ticket workflow</span></header>
<main class="narrow"><a class="back" href="/">← Back to dashboard</a><div class="eyebrow" th:text="${'TICKET #' + ticket.id}">TICKET</div><h1 th:text="${ticket.title}">Issue</h1>
<div class="notice ok" th:if="${success}" th:text="${success}"></div><div class="notice err" th:if="${error}" th:text="${error}"></div>
<section class="panel fields"><div class="detail-grid"><div><span>Priority</span><strong th:text="${ticket.priority}">HIGH</strong></div><div><span>Status</span><strong th:text="${ticket.status}">OPEN</strong></div>
<div><span>Location</span><strong th:text="${ticket.building + ' / ' + ticket.room}">B / 201</strong></div><div><span>Category</span><strong th:text="${ticket.category}">ELECTRICAL</strong></div>
<div><span>Reported</span><strong th:text="${#temporals.format(ticket.createdAt,'dd MMM yyyy, HH:mm')}">date</strong></div><div><span>Due by</span><strong th:text="${#temporals.format(ticket.dueAt,'dd MMM yyyy, HH:mm')}">date</strong></div></div>
<h2>Description</h2><p th:text="${ticket.description}">Description</p>
<h2>Update workflow</h2><form th:if="${ticket.status.name() != 'RESOLVED'}" th:action="@{/tickets/{id}/status(id=${ticket.id})}" method="post" class="filters"><select name="status"><option value="IN_PROGRESS">In progress</option><option value="RESOLVED">Resolved</option></select><button class="btn" type="submit">Update status</button></form>
<p th:if="${ticket.status.name() == 'RESOLVED'}">This request is resolved. Resolved tickets are read-only in the demo.</p>
</section></main></div></body></html>
